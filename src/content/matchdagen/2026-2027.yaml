# Matchdagen, säsong 2026/27. Källa: docs/matchdagen.md och Västernorrlands ungdomsmatris.
# Skriv aldrig in matchflyttsavgifter eller tidsgränser här – de ändras; länka till aktuell information.
season: 2026-2027
sections:
