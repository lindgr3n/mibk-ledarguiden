# Röd nivå, säsong 2026/27. Källa: Västernorrlands ungdomsmatris 2026/27 (sida 1) och docs/quick-look/division-5.md.
# Matrisraderna för division 1-5 är lika på allt utom kolumnen Tabell / poängliga: division 1 har Ja/Ja,
# division 2-5 har Ja/Nej. Därför gäller faktagrupperna division 1-5, tabellgruppen division 2-5, och
# division 1:s avvikelse ligger i src/content/divisionsanpassningar (ADR 0002).
season: 2026-2027
level: rod
name: Röd nivå
divisions:
  from: 1
  to: 5
factGroups:
  - id: spelform-och-speltid
    title: Spelform och speltid
    status: verifierad
    appliesTo: [1, 2, 3, 4, 5]
    checked: "2026-10-12"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: spelform, label: Spelform, value: "5 utespelare + målvakt" }
      - { key: matchtid, label: Speltid, value: "3 × 15 min effektiv tid" }
      - { key: paus, label: Paus, value: "5 minuter; inget sidbyte" }
      - { key: byten, label: Byten, value: Flygande }
  - id: plan-och-mal
    title: Plan och mål
    status: verifierad
    appliesTo: [1, 2, 3, 4, 5]
    checked: "2026-10-12"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: plan, label: Plan, value: "18 × 36 m" }
      - { key: mal, label: Mål, value: "160 × 115 cm" }
  - id: domare-och-sekretariat
    title: Domare och sekretariat
    status: verifierad
    appliesTo: [1, 2, 3, 4, 5]
    checked: "2026-10-12"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: domare, label: Domare, value: "2, tillsatta av VIBF" }
      - { key: sekretariat, label: Sekretariat, value: "iBIS Online; resultattavla" }
  - id: tabell-och-poangliga
    title: Tabell och poängliga
    status: verifierad
    appliesTo: [2, 3, 4, 5]
    checked: "2026-10-12"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: tabell, label: Tabell / poängliga, value: "Ja/Nej" }
  - id: ledarutbildning
    title: Ledarutbildning
    status: verifierad
    appliesTo: [1, 2, 3, 4, 5]
    checked: "2026-10-12"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: ledarutbildning, label: Ledarutbildning, value: "Grundutbildning barn/ungdom + Steg 1 Röd (eller högre nivå)" }
# Regelhierarki (ADR 0003). Bara dokumenterade uppgifter (docs/nya-regler-2026-27.md,
# docs/quick-look/division-5.md). Lägg till regelavsnitt först när texten kontrollerats mot originalkällan.
ruleSections:
  - id: regelhandbok-2026
    title: Regelhandbok 2026
    statements:
      - ruleSource: nationell-regel
        text: "Ny regelhandbok gäller från 1 juli 2026. Presentationen Nya regler 2026 gäller regeländringar nationellt och är inte nödvändigtvis tillämplig på ungdomsnivå utan anpassningar."
        appliesTo: [5]
        checked: "2026-10-12"
        source:
          label: Regelhandbok 2026 (Svensk Innebandy)
          url: "https://www.innebandy.se/media/qaljq1sz/regelhandboken-2026-lowres.pdf"
      - ruleSource: distriktsanpassning
        text: "Västernorrlands ungdomsmatris innehåller anpassningar för division 5, bland annat om målvakt som senare spelar ute, protokoll och utvisningar. Läs dem på matrisens sida 2 och kontrollera alltid lokala ungdomsundantag innan en nationell regel tillämpas."
        appliesTo: [5]
        checked: "2026-10-12"
        source:
          label: Västernorrlands ungdomsmatris 2026/27, sida 2
          url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=2"
