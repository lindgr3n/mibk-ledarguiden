    facts:
      - { key: mal, label: Mål, value: "Små mål (ca 60 × 40 cm)\nMed målvakt 120 × 90 cm" }
  - id: domare-och-sekretariat
    title: Domare och sekretariat
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
