    facts:
      # Metermåttet saknas i matrisen. "ca 20 × 12 m" är en uppskattning (nationell spelform) som ska mätas upp och bekräftas.
      - { key: plan, label: Plan, value: "3 sargbitar bred och 6 eller 7 sargbitar lång, plus hörn (ca 20 × 12 m, ej mätt)" }
