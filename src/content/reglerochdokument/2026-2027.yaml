news:
  title: Nytt för 2026/27
  summary: Ny regelhandbok gäller från 1 juli 2026.
  checked: "2026-10-12"
  items:
    - label: Målvakternas säkerhet
      text: Skymning, målvaktsområde och kontakt med målvakt. Se presentationen sida 2–4.
    - label: Byteszonen
      text: Spelares och ledares placering. Se presentationen sida 5–7.
    - label: Övriga ändringar
      text: Se presentationsbilderna och den ändringsmarkerade regelhandboken i stället för en ofullständig andrahandslista.
  links:
    - label: Nya regler 2026 – presentation (27 sidor)
      note: Enklaste vägen in.
      url: "https://www.innebandy.se/media/wg3jha4x/nya-regler-presentation.pdf"
    - label: Regelhandboken med alla ändringar från 2022 markerade
      note: För att se exakt vad som förändrats.
      url: "https://www.innebandy.se/media/yyzmfrej/regelhandboken-2026-med-alla-andringar-fran-2022.pdf"
  caveat: Presentationen gäller regeländringar nationellt. Alla punkter är inte nödvändigtvis tillämpliga på ungdomsnivå utan anpassningar. Se därför alltid ungdomsundantagen och lokala bestämmelser innan en generell regel tillämpas.
matchEnvironment:
  definition: En trygg, respektfull och utvecklande match där ledarnas agerande sätter tonen för spelare, domare och publik.
  # Föreningsvägledning: bara det som Moälvens befintliga riktlinjer (Moälvens spelutvecklingsplan, utkast) redan säger.
  # Tre föreslagna principer saknar stöd där och är medvetet utelämnade tills föreningen har beslutat (docs/open-questions.md).
  principles:
    - text: "Långsiktig utveckling går före dagsresultat. Lärande går före resultat."
      basis: "Moälvens spelutvecklingsplan, Grundprinciper: Långsiktighet"
      checked: "2026-10-27"
    - text: "Hälsa på motståndare och domare före match, och tacka efteråt."
      basis: "Moälvens spelutvecklingsplan, Grundprinciper: Ledarskap"
      checked: "2026-10-27"
  links:
    - label: "Barn och ungdom (Västernorrlands IBF)"
      note: Manualer och föreskrifter, bland annat om hur en ungdomsmatch arrangeras.
      checked: "2026-10-12"
      url: "https://www.innebandy.se/vasternorrland/tavling/barnungdom"
    - label: "Den goda innebandymiljön (Svensk Innebandys utvecklingsmodell)"
      note: Förbundets beskrivning av vad som kännetecknar en trygg och utvecklande innebandymiljö.
      checked: "2026-10-27"
      url: "https://www.innebandy.se/utveckling/svensk-innebandys-utvecklingsmodell-siu/den-goda-innebandymiljon"
    - label: "Matchvärd och Sekretariat (Västernorrlands IBF)"
