# Grön nivå, säsong 2026/27. Källa: Västernorrlands ungdomsmatris 2026/27 (sida 1, raden för division 8.9, och sida 2 för den lokala regeln).
# Kontrollerat av innehållsansvarig 2026-10-27. Det som skiljer division 8 och 9 åt (målvakt) ligger i
# src/content/divisionsanpassningar och upprepas inte här (ADR 0002).
season: 2027-2028
level: gron
name: Grön nivå
divisions:
  from: 8
  to: 9
factGroups:
  - id: spelform-och-speltid
    title: Spelform och speltid
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: spelform, label: Spelform, value: "3 mot 3, lokala sammandrag" }
      - { key: matchtid, label: Speltid, value: "1 × 15 min rullande tid" }
      - { key: byten, label: Byten, value: "Tutbyte, 90 sek" }
      - { key: paus, label: Paus och sidbyte, value: "Ingen paus, inget sidbyte" }
  - id: plan
    title: Plan
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: plan, label: Plan, value: "3 sargbitar bred och 6 eller 7 sargbitar lång, plus hörn" }
  - id: mal
    title: Mål
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: mal, label: Mål, value: "Små mål (ca 60 × 40 cm); med målvakt 120 × 90 cm" }
  - id: domare-och-sekretariat
    title: Domare och sekretariat
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: domare, label: Domare, value: "1 föreningsdomare" }
      - { key: sekretariat, label: Sekretariat, value: "Tidtagare, även för byten" }
      - { key: tabell, label: Tabell, value: "Ingen tabell och ingen resultattavla" }
  - id: ledarutbildning
    title: Ledarutbildning och anmälan
    status: verifierad
    appliesTo: [8, 9]
    checked: "2026-10-27"
    source:
      label: Västernorrlands ungdomsmatris 2026/27, sida 1
      url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
    facts:
      - { key: ledarutbildning, label: Ledarutbildning, value: "Grundutbildning barn/ungdom + Steg 1 Grön" }
      - { key: anmalan, label: Anmälan, value: "Löpande, ca två veckor innan respektive sammandrag" }
ruleSections:
  - id: lokal-regel
    title: Lokal regel för division 8–9
    statements:
      - ruleSource: distriktsanpassning
        status: verifierad
        text: "Inga mål får göras från egen planhalva. Ledare ska stötta föreningsdomarna och uppmana till spel, och att spelare inte står i målgården."
        appliesTo: [8, 9]
        checked: "2026-10-27"
        source:
          label: Västernorrlands ungdomsmatris 2026/27, sida 2
          url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=2"
  - id: nationell-spelform
    title: Nationell spelform och distriktets anpassning
    needsConfirmation: "Distriktets mått för plan och mål skiljer sig från den nationella handboken, och planens exakta mått i meter är inte bekräftade av Västernorrlands IBF. Kontrollera med distriktet vad som gäller för ert sammandrag."
    statements:
      - ruleSource: nationell-regel
        status: verifierad
        text: "Tre mot tre utan målvakt: spelplanen ska normalt vara 20 × 12 meter och målburarna 90 × 60 cm. Speltiden är rullande, byten sker som intervallbyten som sekretariatet signalerar, och matchen döms av en eller två matchledare."
        appliesTo: [9]
        checked: "2026-10-27"
        source:
          label: Handbok för nationella spelformer på grön och blå nivå (uppdaterad 2023-10-19)
          url: "https://www.innebandy.se/media/ta5bn1jz/svensk-innebandys-handbok-fo-r-nationella-spelformer-pa-gro-n-och-bla-niva-upt-20231019.pdf#page=29"
      - ruleSource: nationell-regel
        status: verifierad
        text: "Tre mot tre med målvakt: spelplanen ska normalt vara 20 × 12 meter och målburarna 120 × 90 cm. Speltiden är rullande, byten sker som intervallbyten som sekretariatet signalerar, och matchen döms av en eller två matchledare."
        appliesTo: [8]
        checked: "2026-10-27"
        source:
          label: Handbok för nationella spelformer på grön och blå nivå (uppdaterad 2023-10-19)
          url: "https://www.innebandy.se/media/ta5bn1jz/svensk-innebandys-handbok-fo-r-nationella-spelformer-pa-gro-n-och-bla-niva-upt-20231019.pdf#page=35"
      - ruleSource: distriktsanpassning
        status: verifierad
        text: "Västernorrlands matris anger för division 8–9 en mindre plan (3 × 6/7 sargbitar + hörn) och för division 9 små mål (ca 60 × 40 cm). Division 8 har samma mål som den nationella spelformen (120 × 90 cm)."
        appliesTo: [8, 9]
        checked: "2026-10-27"
        source:
          label: Västernorrlands ungdomsmatris 2026/27, sida 1
          url: "https://www.innebandy.se/media/bjoi2qrd/matris-ungdom-2026-27-med-arvoden.pdf#page=1"
